# ==============================================================================
# Netlify Configuration File for InfluencerHub Frontend Deployment
# ==============================================================================

[build]
  base = "artifacts/influencer-hub"
  publish = "dist/public"
  command = "npm run build"

# SPA Fallback Redirect for Wouter client-side routing (/login, /signup, /onboarding, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

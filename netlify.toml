[build]
  command = "npm --prefix artifacts/influencer-hub install && npm --prefix artifacts/influencer-hub run build"
  publish = "artifacts/influencer-hub/dist/public"

[build.environment]
  NODE_VERSION = "20"

# SPA client-side routing for React/Wouter router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

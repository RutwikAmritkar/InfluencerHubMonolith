[build]
  command = "npx -y pnpm@9.15.4 install --no-frozen-lockfile && npx -y pnpm@9.15.4 --filter influencer-hub-fe run build"
  publish = "artifacts/influencer-hub/dist/public"

[build.environment]
  NODE_VERSION = "20"

# SPA client-side routing for React/Wouter router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

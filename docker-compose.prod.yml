services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: creatorsbrand:production
    container_name: creatorsbrand-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PORT=5001
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://creatorsbrand.in}
      - APP_URL=${APP_URL:-https://creatorsbrand.in}
      - FRONTEND_URL=${FRONTEND_URL:-https://creatorsbrand.in}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-r2}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

